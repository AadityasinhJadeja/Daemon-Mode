name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Static checks
        run: |
          python3 -m py_compile tools/*.py
          python3 -m json.tool extension/manifest.json >/dev/null
          find extension site tools -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;
          bash -n tools/install-local-service-launch-agent.sh tools/uninstall-local-service-launch-agent.sh

      - name: Evidence and setup proofs
        run: |
          python3 tools/answer-eval.py
          python3 tools/mcp-retrieval-eval.py
          python3 tools/mcp-loop-proof.py
          python3 tools/managed-runtime-proof.py
          python3 tools/setup-agent-harness-proof.py
          python3 tools/package-extension-proof.py
          python3 tools/first-run-agent-proof.py --db-path "$RUNNER_TEMP/daemon-first-run.sqlite3" --cleanup

      - name: Full isolated smoke test
        run: python3 tools/smoke-test.py
